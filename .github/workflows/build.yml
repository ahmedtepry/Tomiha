name: Build APK and Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=android --project-name bonnaya --org com.bonnaya .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test
      - name: Allow internet and set app name
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES"/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          sed -i 's#android:label="[^"]*"#android:label="BONNAYA"#' android/app/src/main/AndroidManifest.xml
      - name: Sign with the fixed BONNAYA key (so updates install over old versions)
        run: |
          cp signing/bonnaya.jks android/app/bonnaya.jks
          printf 'storePassword=bonnaya-pass\nkeyPassword=bonnaya-pass\nkeyAlias=bonnaya\nstoreFile=bonnaya.jks\n' > android/key.properties
          python3 - <<'PY'
          import re
          p = 'android/app/build.gradle.kts'
          s = open(p).read()
          s = 'import java.util.Properties\nimport java.io.FileInputStream\n' + s
          s = s.replace('android {', 'val keyProps = Properties().apply { load(FileInputStream(rootProject.file("key.properties"))) }\nandroid {', 1)
          s = s.replace('buildTypes {', 'signingConfigs { create("bonnaya") { keyAlias = keyProps["keyAlias"] as String; keyPassword = keyProps["keyPassword"] as String; storeFile = file(keyProps["storeFile"] as String); storePassword = keyProps["storePassword"] as String } }\n    buildTypes {', 1)
          s = s.replace('signingConfigs.getByName("debug")', 'signingConfigs.getByName("bonnaya")')
          open(p, 'w').write(s)
          PY
      - run: flutter pub get
      - name: Apply app icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons -f icons_android.yaml
          sed -i 's#android:icon="@mipmap/ic_launcher"#android:icon="@mipmap/launcher_icon"#' android/app/src/main/AndroidManifest.xml
      - run: flutter build apk --release -t lib/main.dart --build-number=${{ github.run_number }}
      - run: cp build/app/outputs/flutter-apk/app-release.apk bonnaya.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bonnaya-apk
          path: bonnaya.apk

  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform files
        run: |
          cp -r lib /tmp/lib_backup
          cp pubspec.yaml /tmp/pubspec_backup.yaml
          flutter create --platforms=windows --project-name bonnaya --org com.bonnaya .
          rm -rf lib && cp -r /tmp/lib_backup lib
          cp /tmp/pubspec_backup.yaml pubspec.yaml
          rm -rf test
      - name: Bundle the receipt font (offline printing)
        run: curl -L --fail -o assets/fonts/Cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" || true
      - name: Set window title
        run: sed -i 's/L"bonnaya"/L"BONNAYA Cashier"/' windows/runner/main.cpp
      - run: flutter pub get
      - name: Apply app icon
        run: |
          flutter pub add --dev flutter_launcher_icons
          dart run flutter_launcher_icons -f icons_windows.yaml
      - name: Build Windows
        env:
          CXXFLAGS: /D_SILENCE_EXPERIMENTAL_COROUTINE_DEPRECATION_WARNINGS
        run: flutter build windows --release -t lib/main_cashier.dart --build-number=${{ github.run_number }}
      - name: Zip the app
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath bonnaya-cashier-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: bonnaya-cashier-windows
          path: bonnaya-cashier-windows.zip

  release:
    needs: [apk, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          files: dist/*
